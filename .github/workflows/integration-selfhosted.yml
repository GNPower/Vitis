name: Integration (self-hosted Vitis)

# Full-flow regression. Runs a real `Do CREATE` followed by a Vitis
# server build inside a Vitis Docker container on a self-hosted runner. A full
# Vitis install is 130+ GB, so this cannot run on GitHub-hosted runners, it
# needs a runner registered with the labels [self-hosted, vitis] and a cached
# Vitis image. See ci/README.md and ci/Dockerfile.
#
# workflow_dispatch-only on purpose: with no matching runner the job would queue
# forever, so it is never triggered automatically.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Name of the Top/ project to CREATE and BUILD"
        required: true
        default: "ci_example"

jobs:
  integration:
    name: Full create + build with real Vitis
    runs-on: [self-hosted, vitis]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create project (Vitis server)
        run: ./Vitis/Do CREATE "${{ inputs.project }}"

      - name: Build whole project (Vitis server)
        run: ./Vitis/Do BUILD "${{ inputs.project }}" --all --tools vitis

      - name: Verify ELF was produced
        shell: bash
        run: |
          elf="src/Projects/${{ inputs.project }}/build/${{ inputs.project }}.elf"
          test -f "$elf" && echo "Built $elf" || (echo "Missing $elf" && exit 1)
