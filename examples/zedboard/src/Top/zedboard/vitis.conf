# Top-level project config for the ZedBoard example.
# `Do CREATE zedboard` reads this file and the ones it references.

[platform]
NAME = zedboard
DESCRIPTION = ZedBoard Zynq-7000 example platform
# Name of the platform config file, excluding the `.conf` extension
CONFIG = platform

[application]
NAME = hello
DESCRIPTION = Minimal standalone hello-world application
# Name of the application config file, excluding the `.conf` extension
CONFIG = application

# Multiple applications can be created by adding additional [application_N] sections.
# The [application] section remains the main project application

# [application_1]
# NAME = hello_again
# DESCRIPTION = Addition application for this project, maybe I run on core #2
# # A different application config can be passed as well
# CONFIG = second_application