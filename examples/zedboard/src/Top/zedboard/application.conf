# Application config for the "hello" app.
#
# TEMPLATE is empty, so Vitis creates a bare application component and the tool
# compiles the source listed under [compiler] source_files. This is the same
# empty-template + source_files pattern a real project woud use.

[application]
PLATFORM = zedboard
DOMAIN = standalone_ps7_cortexa9_0
# Vitis template project to use for this application. Examples are: hello_world, empty_application, freertos_hello_world, etc. 
# If TEMPLATE is empty, Vitis creates a bare application component and compiles the source listed under [compiler] source_files.
TEMPLATE =

[compiler]
# Optimization level: none, O1, O2, O3, Os
optimization_level = O2
# Debug level: none, g1, g2, g3
debug_level = g3
warnings_all = true
warnings_extra = true

# The one source file to compile. ${PARENT_DIR} is the workspace src/ directory,
# so this resolves to src/example_app/main.c.
source_files = ${PARENT_DIR}/example_app/main.c

[linker]
# No custom linker settings. The default lscript.ld generated for the platform is used.
