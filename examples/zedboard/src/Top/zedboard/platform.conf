# Platform config: build the platform from a committed .xsa hardware file.

[flow]
SOURCE = xsa
# Resolves to <workspace>/hdl/data/ZedBoard.xsa
XSA = ZedBoard

[boot]
# Generate the standard FSBL / boot BSP.
BOOT_COMPONENTS = true

[domain]
NAME = standalone_ps7_cortexa9_0
DISPLAY_NAME = standalone on ps7_cortexa9_0
PROCESSOR_INSTANCE = ps7_cortexa9_0
OS = standalone
CONFIG = domain
