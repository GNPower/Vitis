# Domain / BSP config. Deliberately minimal: standalone OS with stdio routed to
# UART1. No extra libraries or drivers, so the example builds with just the base
# standalone BSP. Libraries and drivers can be added by adding [library_N] and [driver_N] 
# sections to this file, see the commented sections below for examples.

[domain]
OS = standalone

[compiler]
flags = -g

[os]
stdin = ps7_uart_1
stdout = ps7_uart_1

